<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=728,height=90">
    <title>Sunfeast Dark Fantasy - IAB Banner (728x90)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 728px;
            height: 90px;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2A1810 0%, #6D3B23 100%);
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        .ad-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
            padding: 12px;
            color: #FFFFFF;
        }
        .brand-badge {
            font-size: 18px;
            font-weight: 800;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .headline {
            font-size: 11px;
            font-weight: 600;
            text-align: left;
            line-height: 1.2;
            color: #FFF;
            max-width: 80%;
        }
        .cta-button {
            background: #D4AF37;
            color: #2A1810;
            font-weight: 700;
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .cta-button:hover {
            transform: scale(1.05);
            background: #FFFFFF;
        }
        .iab-iba-icon {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 8px;
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.4);
            padding: 1px 4px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="ad-container" onclick="window.open('https://www.itcportal.com', '_blank')">
        <div class="brand-badge">Sunfeast Dark Fantasy</div>
        <div class="headline">Indulgent appetizing visual of Sunfeast Dark Fantasy Dark Fantasy Choco Fills, showcasing Molten liquid choco burst during Diwali & Festive Gifting Sparkle</div>
        <a class="cta-button" href="javascript:void(0);">Buy Now &rarr;</a>
    </div>
    <div class="iab-iba-icon" title="Interest Based Advertising (IAB Compliant)">AdChoices &#9654;</div>
</body>
</html>
